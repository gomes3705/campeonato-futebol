<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Campeonato de Futebol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Campeonato de Futebol</h1>

    <div class="secao">
        <h2>Cadastrar time</h2>
        <input type="text" id="nomeTime" placeholder="Nome do time">
        <input type="text" id="nomeTecnico" placeholder="Nome do técnico">
        <button onclick="cadastrarTime()">Cadastrar</button>
    </div>

    <div class="secao">
        <h2>Cadastrar jogador</h2>
        <select id="selectTime"></select>
        <input type="text" id="nomeJogador" placeholder="Nome do jogador">
        <input type="text" id="posicaoJogador" placeholder="Posição">
        <button onclick="cadastrarJogador()">Cadastrar</button>
    </div>

    <div class="secao">
        <h2>Registrar partida</h2>
        <select id="selectCasa"></select>
        <input type="number" id="golsCasa" placeholder="Gols" min="0">
        x
        <input type="number" id="golsVisitante" placeholder="Gols" min="0">
        <select id="selectVisitante"></select>
        <button onclick="registrarPartida()">Registrar</button>
    </div>

    <div class="secao">
        <h2>Classificação</h2>
        <table id="tabelaClassificacao">
            <tr>
                <th>Time</th>
                <th>Pts</th>
                <th>V</th>
                <th>E</th>
                <th>D</th>
                <th>SG</th>
            </tr>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
